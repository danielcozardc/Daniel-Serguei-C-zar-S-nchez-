<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="base.js"></script>
<style>
.sec{position:absolute;inset:0;opacity:0}
.ttl{position:absolute;left:70px;top:330px;text-align:left}
.ttl .k{font-family:Oswald;color:var(--red);letter-spacing:10px;font-size:30px}
.ttl .h{font-family:Anton;font-size:130px;line-height:.95;text-transform:uppercase;margin-top:14px}
.frame{position:absolute;left:60px;right:60px;top:690px;height:640px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#ececec;border-radius:24px;opacity:0}
.col{position:absolute;left:70px;top:1380px;font-family:Oswald;font-weight:600;font-size:46px;letter-spacing:5px;display:flex;align-items:center;gap:22px}
.col i{width:40px;height:40px;border-radius:50%;border:3px solid #666;display:inline-block}
.cnt{position:absolute;right:70px;top:1385px;font-family:Oswald;font-size:36px;color:#888;letter-spacing:4px}
.prog{position:absolute;left:70px;right:70px;top:1490px;height:6px;background:#222}
.prog b{display:block;height:100%;background:var(--red);width:0}
</style></head><body>
<div id="stage">
  <div id="intro" class="sec">
    <div class="abs osw red" style="top:700px;font-size:40px;letter-spacing:14px">DAVAI COMBAT SPORTS</div>
    <div id="in1" class="abs anton" style="top:760px;font-size:250px">NUEVA</div>
    <div id="in2" class="abs anton red" style="top:1050px;font-size:210px">COLECCIÓN</div>
  </div>
  <div id="s1" class="sec"></div><div id="s2" class="sec"></div><div id="s3" class="sec"></div>
  <div id="end" class="sec">
    <img id="ev" class="v" src="a/v.png" style="width:560px;top:600px">
    <div id="en1" class="abs anton" style="top:900px;font-size:104px">FEMENINA · MASCULINA</div>
    <div id="en2" class="abs osw" style="top:1050px;font-size:40px;letter-spacing:14px">HONOR · VALOR · RESPETO</div>
    <div id="en3" class="abs" style="top:1180px"><span style="display:inline-block;background:var(--red);font-family:Oswald;font-weight:600;font-size:52px;letter-spacing:8px;padding:26px 50px;border-radius:10px">PÍDELO POR DM</span></div>
    <div class="handle">@DAVAICOMBATSPORTS</div>
  </div>
  <div id="flash"></div><div id="grain"></div>
</div>
<script>
const DUR = 14;
const F = [['Negro / Rojo','#111'],['Rosa','#f2a9c2'],['Blanco','#fff'],['Azul marino','#1b2a5c'],['Rojo','#e30613'],['Gris','#777']];
const M = [['Negro / Rojo','#111'],['Blanco','#fff'],['Azul marino','#1b2a5c'],['Rojo','#e30613'],['Gris','#777'],['Verde oliva','#556b2f']];
const P = [['Negro','#111','polo_negro'],['Azul marino','#1b2a5c','polo_azul'],['Blanco','#fff','polo_blanco'],['Rosa','#f2a9c2','polo_rosa']];
const SECS = [
  { id: 's1', k: 'Colección femenina', h: 'Short<br>Muay Thai', s: 1.6, e: 5.0, items: F.map((c, i) => [c[0], c[1], `var_fem-06_${i + 1}`]) },
  { id: 's2', k: 'Colección masculina', h: 'Rashguard<br>manga larga', s: 5.0, e: 8.4, items: M.map((c, i) => [c[0], c[1], `var_mas-08_${i + 1}`]) },
  { id: 's3', k: 'Nuevo', h: 'Polo<br><span class="red">Davai</span>', s: 8.4, e: 11.0, items: P },
];
SECS.forEach(S => {
  $(S.id).innerHTML = `<div class="ttl"><div class="k">${S.k.toUpperCase()}</div><div class="h">${S.h}</div></div>
   <div class="frame">${S.items.map(it => `<img src="a/${it[2]}.png">`).join('')}</div>
   <div class="col"><i></i><span></span></div><div class="cnt"></div><div class="prog"><b></b></div>`;
});
function render(t) {
  // intro slam
  st('intro', { opacity: win(t, 0, 1.6, .12) });
  const p1 = eb(prog(t, .15, .35)), p2 = eb(prog(t, .55, .35));
  st('in1', { opacity: cl(p1 * 1.5), transform: `scale(${lerp(2, 1, cl(p1))})` });
  const [sx, sy] = shake(t, .6, .35, 20);
  st('in2', { opacity: cl(p2 * 1.5), transform: `scale(${lerp(2.2, 1, cl(p2))}) translate(${sx}px,${sy}px)` });
  st('flash', { opacity: (win(t, .58, .75, .05) * .3 + win(t, 1.55, 1.7, .05) * .25).toFixed(3) });
  // product sections
  SECS.forEach(S => {
    const el = $(S.id), o = win(t, S.s, S.e, .15);
    st(el, { opacity: o });
    if (o <= 0) return;
    const local = t - S.s, n = S.items.length, slot = (S.e - S.s - .2) / n;
    const idx = Math.min(n - 1, Math.max(0, Math.floor(local / slot)));
    const tin = eo(prog(local, 0, .45));
    st(el.querySelector('.ttl'), { transform: `translateX(${(1 - tin) * -120}px)`, opacity: tin });
    el.querySelectorAll('.frame img').forEach((im, i) => {
      const a = i === idx ? eo(cl((local - i * slot) / .12)) : (i === idx - 1 ? 1 - eo(cl((local - idx * slot) / .12)) : 0);
      st(im, { opacity: a, transform: `scale(${i === idx ? lerp(1.015, 1, eo(cl((local - i * slot) / .3))) : 1})` });
    });
    const it = S.items[idx];
    el.querySelector('.col span').textContent = it[0].toUpperCase();
    st(el.querySelector('.col i'), { background: it[1] });
    el.querySelector('.cnt').textContent = `${idx + 1} / ${n}`;
    st(el.querySelector('.prog b'), { width: `${cl(local / (S.e - S.s - .2)) * 100}%` });
  });
  // end card
  st('end', { opacity: cl((t - 11.0) / .15) });
  const ev = eo(prog(t, 11.0, .45));
  st('ev', { opacity: ev, transform: `translate(-50%,-50%) scale(${lerp(1.7, 1, ev)})` });
  const a = eb(prog(t, 11.4, .4)); st('en1', { opacity: cl(a * 1.4), transform: `translateY(${(1 - cl(a)) * 60}px)` });
  st('en2', { opacity: eo(prog(t, 11.8, .5)) });
  const c = eb(prog(t, 12.2, .4)); st('en3', { opacity: cl(c * 1.4), transform: `scale(${lerp(1.5, 1, cl(c))})` });
  grain(t);
}
</script></body></html>
