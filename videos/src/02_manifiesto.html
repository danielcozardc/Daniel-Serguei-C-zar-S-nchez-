<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="base.js"></script></head><body>
<div id="stage">
  <img id="bgv" class="v" src="a/v.png" style="width:1500px;opacity:0">
  <div id="a1" class="abs anton" style="top:640px;font-size:230px">NO ES</div>
  <div id="a2" class="abs anton" style="top:870px;font-size:190px">UN DEPORTE.</div>
  <div id="b1" class="abs anton" style="top:640px;font-size:230px">ES UNA</div>
  <div id="b2" class="abs anton red" style="top:870px;font-size:250px">ACTITUD.</div>
  <div id="w" class="abs anton" style="top:820px;font-size:200px"></div>
  <div id="wn" class="abs osw red" style="top:760px;font-size:34px;letter-spacing:10px"></div>
  <img id="v" class="v" src="a/v.png" style="width:620px;top:700px;opacity:0">
  <div id="e1" class="abs anton" style="top:1000px;font-size:200px">DA<span class="red">V</span>AI</div>
  <div id="e2" class="abs osw" style="top:1210px;font-size:40px;letter-spacing:16px">HONOR · VALOR · RESPETO</div>
  <div id="e3" class="handle">@DAVAICOMBATSPORTS</div>
  <div id="flash"></div><div id="grain"></div>
</div>
<script>
const DUR = 12;
const WORDS = ['DISCIPLINA', 'CARÁCTER', 'RESILIENCIA', 'SUPERACIÓN', 'LIBERTAD'];
function pop(id, t, s, e, from = 1.6) {
  const p = eb(prog(t, s, .35)), o = win(t, s, e, .12);
  st(id, { opacity: o, transform: `scale(${lerp(from, 1, cl(p))})` });
}
function render(t) {
  pop('a1', t, .3, 3.0); pop('a2', t, 1.1, 3.0, .7);
  pop('b1', t, 3.2, 5.6); pop('b2', t, 4.0, 5.6, 2.2);
  const [sx, sy] = shake(t, 4.05, .4, 22);
  $('b2').style.transform += ` translate(${sx}px,${sy}px)`;
  st('flash', { opacity: (win(t, 4.0, 4.2, .06) * .35).toFixed(3) });
  // rapid words
  const ws = 5.8, wd = .48;
  const i = Math.floor((t - ws) / wd);
  if (t >= ws && i < WORDS.length) {
    const lp = (t - ws - i * wd) / wd;
    $('w').textContent = WORDS[i]; $('wn').textContent = '0' + (i + 1);
    st('w', { opacity: 1, transform: `scale(${lerp(1.25, 1, eo(cl(lp * 3)))})`, color: i % 2 ? 'var(--red)' : '#f2f2f2' });
    st('wn', { opacity: 1 });
    st('bgv', { opacity: .12, transform: `translate(-50%,-50%) scale(${1 + lp * .06})` });
  } else { st('w', { opacity: 0 }); st('wn', { opacity: 0 }); st('bgv', { opacity: 0 }); }
  // end card
  const ev = eo(prog(t, 8.4, .5));
  st('v', { opacity: ev, transform: `translate(-50%,-50%) scale(${lerp(1.8, 1, ev)})`, filter: `blur(${(1 - ev) * 12}px)` });
  const e1 = eb(prog(t, 8.9, .45));
  st('e1', { opacity: cl(e1 * 1.4), transform: `translateY(${(1 - cl(e1)) * 80}px)` });
  const e2 = eo(prog(t, 9.5, .7));
  st('e2', { opacity: e2, letterSpacing: `${lerp(4, 16, e2)}px` });
  st('e3', { opacity: eo(prog(t, 10.1, .6)) });
  grain(t);
}
</script></body></html>
