<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="base.js"></script>
<style>
#logo{position:absolute;inset:0;transform-origin:540px 900px}
#strip{position:absolute;left:0;top:880px;width:1080px;height:470px}
.it{position:absolute;top:0;width:420px;height:470px;border-radius:22px;overflow:hidden;background:#ececec}
.it img{width:100%;height:410px;object-fit:contain;display:block;padding:18px}
.it span{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:Oswald;font-weight:600;font-size:24px;letter-spacing:3px;color:#111}
</style></head><body>
<div id="stage">
  <div id="logo">
    <img id="v" class="v" src="a/v_alpha.png" style="width:900px;mix-blend-mode:normal">
    <div id="word" class="abs anton" style="top:830px;font-size:250px;letter-spacing:4px">
      <span>D</span><span>A</span><span class="red">V</span><span>A</span><span>I</span></div>
    <div id="cs" class="abs osw" style="top:1085px;font-size:44px;font-weight:500">COMBAT SPORTS</div>
    <div id="line" style="position:absolute;top:1180px;left:50%;height:6px;background:var(--red);transform:translateX(-50%)"></div>
    <div id="vals" class="abs anton" style="top:1240px;font-size:92px">
      <span id="h1">HONOR</span> <span id="h2" class="red">VALOR</span> <span id="h3">RESPETO</span></div>
  </div>
  <div id="strip"></div>
  <div id="cta" class="abs" style="top:1410px;opacity:0"><span style="display:inline-block;background:var(--red);font-family:Oswald;font-weight:600;font-size:46px;letter-spacing:8px;padding:22px 44px;border-radius:10px">PÍDELO POR DM</span></div>
  <div id="hd" class="handle">@DAVAICOMBATSPORTS</div>
  <div id="flash"></div><div id="grain"></div>
</div>
<script>
const DUR = 16;
const ITEMS = [
  ['ov_fem-01_1', 'Top cruzado'], ['ov_mas-01_3', 'Short MMA'], ['ov_fem-01_2', 'Leggings'],
  ['ov_mas-01_6', 'Rashguard'], ['ov_fem-01_4', 'Short Muay Thai'], ['ov_mas-01_1', 'Sin mangas'],
  ['ov_fem-01_7', 'Sudadera crop'], ['ov_mas-01_7', 'Sudadera'], ['ov_fem-01_3', 'Biker short'],
  ['ov_mas-01_2', 'Mallas'], ['ov_fem-01_8', 'Chaqueta zip'], ['ov_mas-01_4', 'Short Muay Thai'],
  ['ov_fem-01_6', 'Rashguard'], ['ov_mas-01_5', 'Oversize'], ['ov_fem-01_5', 'Camiseta crop'], ['ov_mas-01_8', 'Chaqueta zip'],
];
$('strip').innerHTML = ITEMS.map(i => `<div class="it"><img src="a/${i[0]}.png"><span>${i[1].toUpperCase()}</span></div>`).join('');
const tiles = [...document.querySelectorAll('.it')];
const letters = [...document.querySelectorAll('#word span')];
const T0 = 6.3, GAP = 450, SPEED = 400;
function render(t) {
  // ---- intro (same as the brand intro)
  const pin = eo(prog(t, .4, .45)), up = eo(prog(t, 2.0, .7));
  const [sx, sy] = shake(t, .85, .45, 26);
  const sc = lerp(2.6, 1, pin) * lerp(1, .5, up);
  st('v', { opacity: pin, filter: `blur(${(1 - pin) * 18}px)`,
    transform: `translate(calc(-50% + ${sx}px), calc(-50% + ${sy + lerp(0, -380, up)}px)) scale(${sc})` });
  st('flash', { opacity: (win(t, .82, 1.05, .08) * .4).toFixed(3) });
  letters.forEach((l, i) => { const p = eb(prog(t, 2.35 + i * .09, .35));
    st(l, { display: 'inline-block', opacity: cl(p * 1.5), transform: `translateY(${(1 - p) * 120}px)` }); });
  const c = eo(prog(t, 3.2, .8));
  st('cs', { opacity: c, letterSpacing: `${lerp(4, 22, c)}px` });
  st('line', { width: `${eo(prog(t, 3.6, .7)) * 640}px` });
  ['h1', 'h2', 'h3'].forEach((id, i) => { const p = eb(prog(t, 4.4 + i * .45, .4));
    st(id, { display: 'inline-block', opacity: cl(p * 1.4), transform: `scale(${lerp(1.8, 1, cl(p))})` }); });
  // ---- logo rises and shrinks to make room
  const lu = eo(prog(t, 6.2, .8));
  st('logo', { transform: `translateY(${-420 * lu}px) scale(${lerp(1, .7, lu)})` });
  // ---- clothes slide in from the right and keep moving left
  const run = Math.max(0, t - T0);
  const ease = run < 1 ? 0.5 * run * run : run - .5;     // smooth start, then constant speed
  tiles.forEach((el, i) => {
    const x = 1080 + 70 + i * GAP - ease * SPEED * 1.0;
    st(el, { transform: `translateX(${x}px)`, display: (x > -460 && x < 1100) ? 'block' : 'none' });
  });
  const ct = eb(prog(t, 12.8, .45));
  st('cta', { opacity: cl(ct * 1.4), transform: `scale(${lerp(1.5, 1, cl(ct))})` });
  st('hd', { opacity: eo(prog(t, 13.4, .6)) });
  grain(t);
}
</script></body></html>
